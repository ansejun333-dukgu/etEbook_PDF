            btn.onclick = () => {
              state.theme = btn.getAttribute('data-theme-choice');
              persistAlbum();
              render();
            };
          });

          mainRoot.querySelectorAll('[data-font-choice]').forEach((btn) => {
            btn.onclick = () => {
              state.font = btn.getAttribute('data-font-choice');
              persistAlbum();
              render();
            };
          });

          mainRoot.querySelectorAll('[data-select-page]').forEach((btn) => {
            btn.onclick = () => setPageIndex(Number(btn.getAttribute('data-select-page')));
          });

          mainRoot.querySelectorAll('[data-move-from]').forEach((btn) => {
            btn.onclick = () => {
              movePhoto(
                Number(btn.getAttribute('data-move-from')),
                Number(btn.getAttribute('data-move-to'))
              );
            };
          });

          mainRoot.querySelectorAll('[data-delete-id]').forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              deletePhotoById(btn.getAttribute('data-delete-id'));
            };
          });

          // Cover / Closing / Photo inline inputs (no full re-render while typing)
          if (isCover) {
            const titleEl = document.getElementById('cover-title-input');
            const subEl = document.getElementById('cover-subtitle-input');
            const authorEl = document.getElementById('cover-author-input');
            const dateEl = document.getElementById('cover-date-input');
            autoResizeTextarea(titleEl, 160);

            titleEl.oninput = (e) => {
              state.albumTitle = e.target.value;
              state.isUsingSamples = false;
              autoResizeTextarea(titleEl, 160);
              const stripName = document.getElementById('context-album-name');
              if (stripName) stripName.textContent = state.albumTitle || '나의 사진 앨범';
              persistAlbum();
            };
            subEl.oninput = (e) => {
              state.coverSubtitle = e.target.value;
              state.isUsingSamples = false;
              persistAlbum();
            };
            authorEl.oninput = (e) => {
              state.authorName = e.target.value;
              state.isUsingSamples = false;
              persistAlbum();
            };
            dateEl.oninput = (e) => {
              state.albumDate = e.target.value;
              state.isUsingSamples = false;
              persistAlbum();
            };
          } else if (isClosing) {
            const closingEl = document.getElementById('closing-message-input');
            autoResizeTextarea(closingEl, 260);
            closingEl.oninput = (e) => {
              state.closingMessage = e.target.value;
              state.isUsingSamples = false;
              autoResizeTextarea(closingEl, 260);
              persistAlbum();
            };
          } else if (photo) {
            const imgEl = document.getElementById('stage-photo-img');
            const fallbackEl = document.getElementById('stage-photo-fallback');
            if (imgEl && fallbackEl) {
              imgEl.onerror = () => {
                imgEl.classList.add('hidden');
                fallbackEl.classList.remove('hidden');
              };
            }

            const pTitleEl = document.getElementById('photo-title-input');
            const pDescEl = document.getElementById('photo-desc-input');
            autoResizeTextarea(pDescEl, 120);

            pTitleEl.oninput = (e) => {
              photo.title = e.target.value;
              state.isUsingSamples = false;
              persistAlbum();
            };
            pDescEl.oninput = (e) => {
              photo.description = e.target.value;
              state.isUsingSamples = false;
              autoResizeTextarea(pDescEl, 120);
              persistAlbum();
            };
          }
        }

        function renderOverviewView() {
          const photoCount = state.photos.length;
          const fontClass = getFontClass();
          const sig = [state.authorName.trim(), state.albumDate.trim()].filter(Boolean).join(' · ');

          const coverCardHtml =
            photoCount > 0
              ? `
              <button type="button" class="grid-card grid-special-card ${state.currentIndex === 0 ? 'is-current' : ''}" data-open-page="0">
                <div class="grid-card-top" style="width: 100%; margin: 0;">
                  <span>첫 쪽 · 표지</span>
                  <span style="color: #52525b; text-decoration: underline; text-underline-offset: 4px;">편집</span>
                </div>
                <div style="margin: auto 0; padding: 16px 0; text-align: center; width: 100%;">
                  <p class="${fontClass}" style="font-size: 20px; font-weight: 700; color: #18181b; margin: 0;">${escapeHtml(state.albumTitle || '나의 사진 앨범')}</p>
                  ${state.coverSubtitle ? `<p class="${fontClass}" style="font-size: 12px; color: #71717a; margin: 6px 0 0;">${escapeHtml(state.coverSubtitle)}</p>` : ''}
                </div>
                <div style="width: 100%; padding-top: 12px; border-top: 1px solid #f4f4f5; font-size: 12px; color: #71717a; text-align: center;">
                  ${escapeHtml(sig || '이름 · 날짜 입력')}
                </div>
              </button>
            `
              : '';

          const photoCardsHtml = state.photos
            .map((item, idx) => {
              const pageIdx = idx + 1;
              return `
                <div class="grid-card ${pageIdx === state.currentIndex ? 'is-current' : ''}">
                  <button type="button" class="grid-thumb-btn" data-open-page="${pageIdx}">
                    <img src="${escapeHtml(item.src)}" alt="${escapeHtml(item.title || `페이지 ${idx + 1}`)}" referrerpolicy="no-referrer" />
                  </button>
                  <div class="grid-card-body">
                    <div>
                      <div class="grid-card-top">
                        <span class="font-mono" style="color: #52525b;">${padTwo(idx + 1)} 쪽</span>
                        <button type="button" class="grid-edit-link" data-open-page="${pageIdx}">이 쪽 편집</button>
                      </div>
                      <input type="text" maxlength="80" placeholder="제목 없음" value="${escapeHtml(item.title)}" data-grid-title="${escapeHtml(item.id)}" class="grid-title-input ${fontClass}" />
                      <p class="grid-desc-preview ${fontClass}">${escapeHtml(item.description || '설명을 입력하려면 클릭해 페이지를 열어보세요.')}</p>
                    </div>
                    <div class="grid-card-footer">
                      <div style="display: flex; gap: 4px;">
                        <button type="button" class="icon-btn-sm" data-move-from="${idx}" data-move-to="${idx - 1}" ${idx === 0 ? 'disabled' : ''} title="앞으로 이동">${svgIcon('arrowLeft', 14)}</button>
                        <button type="button" class="icon-btn-sm" data-move-from="${idx}" data-move-to="${idx + 1}" ${idx === photoCount - 1 ? 'disabled' : ''} title="뒤로 이동">${svgIcon('arrowRight', 14)}</button>
                      </div>
                      <button type="button" class="icon-btn-sm danger" data-delete-id="${escapeHtml(item.id)}" title="페이지 삭제">${svgIcon('trash', 14)}</button>
                    </div>
                  </div>
                </div>
              `;
            })
            .join('');

          const closingCardHtml =
            photoCount > 0
              ? `
              <button type="button" class="grid-card grid-special-card ${state.currentIndex === photoCount + 1 ? 'is-current' : ''}" data-open-page="${photoCount + 1}">
                <div class="grid-card-top" style="width: 100%; margin: 0;">
                  <span>마지막 쪽 · 마무리</span>
                  <span style="color: #52525b; text-decoration: underline; text-underline-offset: 4px;">편집</span>
                </div>
                <div style="margin: auto 0; padding: 16px 0; text-align: center; width: 100%;">
                  <p class="${fontClass}" style="font-size: 14px; color: #3f3f46; line-height: 1.6; margin: 0;">${escapeHtml(state.closingMessage || '마무리 문구를 적어보세요...')}</p>
                </div>
                <div style="width: 100%; padding-top: 12px; border-top: 1px solid #f4f4f5; font-size: 12px; color: #a1a1aa; text-align: center;">
                  마무리 인사
                </div>
              </button>
            `
              : '';

          mainRoot.innerHTML = `
            <section class="overview-section">
              <div class="overview-header">
                <div>
                  <p class="overview-kicker">전체 페이지 구성 · 표지 + 사진 ${photoCount}장 + 마무리</p>
                  <h1 class="overview-title">${escapeHtml(state.albumTitle || '나의 사진 앨범')}</h1>
                </div>
                <button type="button" id="overview-add-btn" class="btn-dark">사진 더 올리기</button>
              </div>
              <div class="overview-grid">
                ${coverCardHtml}
                ${photoCardsHtml}
                ${closingCardHtml}
                <button type="button" id="overview-card-add" class="grid-add-card">
                  <div class="empty-icon" style="width: 40px; height: 40px; margin: 0;">${svgIcon('imagePlus', 18)}</div>
                  <span style="font-size: 14px; font-weight: 500; color: #27272a;">사진 추가하기</span>
                  <span style="font-size: 12px; color: #a1a1aa;">여러 장을 동시에 선택할 수 있습니다</span>
                </button>
              </div>
            </section>
          `;

          document.getElementById('overview-add-btn').onclick = () => fileInput.click();
          document.getElementById('overview-card-add').onclick = () => fileInput.click();

          mainRoot.querySelectorAll('[data-open-page]').forEach((btn) => {
            btn.onclick = () => {
              state.currentIndex = Number(btn.getAttribute('data-open-page'));
              state.viewMode = 'single';
              render();
            };
          });

          mainRoot.querySelectorAll('[data-move-from]').forEach((btn) => {
            btn.onclick = () => {
              movePhoto(
                Number(btn.getAttribute('data-move-from')),
                Number(btn.getAttribute('data-move-to'))
              );
            };
          });

          mainRoot.querySelectorAll('[data-delete-id]').forEach((btn) => {
            btn.onclick = () => deletePhotoById(btn.getAttribute('data-delete-id'));
          });

          mainRoot.querySelectorAll('[data-grid-title]').forEach((input) => {
            input.oninput = (e) => {
              const id = input.getAttribute('data-grid-title');
              const target = state.photos.find((p) => p.id === id);
              if (target) {
                target.title = e.target.value;
                state.isUsingSamples = false;
                persistAlbum();
              }
            };
          });
        }

        function render() {
          renderHeader();
          renderBanners();
          if (state.viewMode === 'overview') {
            renderOverviewView();
          } else {
            renderSingleView();
          }
        }

        // ---------- Modals ----------
        function openSettingsModal() {
          document.getElementById('settings-title-input').value = state.albumTitle;
          syncSettingsButtons();
          settingsModal.classList.remove('hidden');
        }

        function closeSettingsModal() {
          settingsModal.classList.add('hidden');
        }

        function syncSettingsButtons() {
          document.getElementById('set-orient-portrait').classList.toggle('is-active', state.orientation === 'portrait');
          document.getElementById('set-orient-landscape').classList.toggle('is-active', state.orientation === 'landscape');
          document.getElementById('set-style-classic').classList.toggle('is-active', state.pageStyle === 'classic');
          document.getElementById('set-style-framed').classList.toggle('is-active', state.pageStyle === 'framed');
        }

        function openPdfModal() {
          if (state.photos.length === 0) return;
          document.getElementById('pdf-title-input').value = state.albumTitle;
          document.getElementById('pdf-opt-cover').checked = state.includeCover;
          document.getElementById('pdf-opt-closing').checked = state.includeClosing;
          document.getElementById('pdf-opt-numbers').checked = state.showPageNumbers;
          document.getElementById('pdf-opt-numbers-label').textContent =
            `하단에 쪽 번호(01 / ${padTwo(state.photos.length)}) 표시`;
          hidePdfError();
          document.getElementById('pdf-progress-wrap').classList.add('hidden');
          syncPdfModalControls();
          pdfModal.classList.remove('hidden');
        }

        function closePdfModal() {
          if (state.isExportingPdf) return;
          pdfModal.classList.add('hidden');
        }

        function syncPdfModalControls() {
          const totalPages =
            state.photos.length + (state.includeCover ? 1 : 0) + (state.includeClosing ? 1 : 0);
          document.getElementById('pdf-subtitle-count').textContent =
            `한 쪽에 사진 한 장씩 총 ${totalPages}페이지의 PDF로 저장됩니다`;
          document.getElementById('pdf-orient-portrait').classList.toggle('is-active', state.orientation === 'portrait');
          document.getElementById('pdf-orient-landscape').classList.toggle('is-active', state.orientation === 'landscape');

          const disabled = state.isExportingPdf;
          document.getElementById('pdf-title-input').disabled = disabled;
          document.getElementById('pdf-opt-cover').disabled = disabled;
          document.getElementById('pdf-opt-closing').disabled = disabled;
          document.getElementById('pdf-opt-numbers').disabled = disabled;
          document.getElementById('pdf-orient-portrait').disabled = disabled;
          document.getElementById('pdf-orient-landscape').disabled = disabled;
          document.getElementById('pdf-export-png-btn').disabled = disabled;
          document.getElementById('pdf-cancel-btn').disabled = disabled;
          const dlBtn = document.getElementById('pdf-download-btn');
          dlBtn.disabled = disabled || state.photos.length === 0;
          dlBtn.textContent = disabled ? '생성 중...' : 'PDF 다운로드';
        }

        function updatePdfProgress(current, total) {
          const wrap = document.getElementById('pdf-progress-wrap');
          wrap.classList.remove('hidden');
          document.getElementById('pdf-progress-text').textContent = `${current} / ${total}`;
          document.getElementById('pdf-progress-bar').style.width =
            `${Math.round((current / Math.max(total, 1)) * 100)}%`;
        }

        function showPdfError(msg) {
          const el = document.getElementById('pdf-error-msg');
          el.textContent = msg;
          el.classList.remove('hidden');
        }

        function hidePdfError() {
          document.getElementById('pdf-error-msg').classList.add('hidden');
        }

        // ---------- Global Event Wiring ----------
        document.getElementById('brand-link').onclick = (e) => {
          e.preventDefault();
          state.viewMode = 'single';
          render();
        };

        document.getElementById('nav-upload').onclick = () => fileInput.click();
        document.getElementById('mob-upload').onclick = () => fileInput.click();

        const toggleView = () => {
          state.viewMode = state.viewMode === 'single' ? 'overview' : 'single';
          render();
        };
        navToggleView.onclick = toggleView;
        mobToggleView.onclick = toggleView;

        document.getElementById('nav-settings').onclick = openSettingsModal;
        document.getElementById('mob-settings').onclick = openSettingsModal;

        navClear.onclick = clearAlbum;
        document.getElementById('mob-clear').onclick = clearAlbum;

        topPdfBtn.onclick = openPdfModal;

        fileInput.onchange = (e) => handleFilesSelected(e.target.files);
        document.getElementById('error-close').onclick = () => {
          state.uploadError = null;
          renderBanners();
        };

        // Settings Modal Events
        settingsModal.onclick = closeSettingsModal;
        document.getElementById('settings-panel').onclick = (e) => e.stopPropagation();
        document.getElementById('settings-close').onclick = closeSettingsModal;
        document.getElementById('settings-done').onclick = closeSettingsModal;
        document.getElementById('settings-title-input').oninput = (e) => {
          state.albumTitle = e.target.value;
          persistAlbum();
          render();
        };
        document.getElementById('set-orient-portrait').onclick = () => {
          state.orientation = 'portrait';
          syncSettingsButtons();
          persistAlbum();
          render();
        };
        document.getElementById('set-orient-landscape').onclick = () => {
          state.orientation = 'landscape';
          syncSettingsButtons();
          persistAlbum();
          render();
        };
        document.getElementById('set-style-classic').onclick = () => {
          state.pageStyle = 'classic';
          syncSettingsButtons();
          persistAlbum();
          render();
        };
        document.getElementById('set-style-framed').onclick = () => {
          state.pageStyle = 'framed';
          syncSettingsButtons();
          persistAlbum();
          render();
        };

        // PDF Modal Events
        pdfModal.onclick = closePdfModal;
        document.getElementById('pdf-panel').onclick = (e) => e.stopPropagation();
        document.getElementById('pdf-close').onclick = closePdfModal;
        document.getElementById('pdf-cancel-btn').onclick = closePdfModal;
        document.getElementById('pdf-title-input').oninput = (e) => {
          state.albumTitle = e.target.value;
          persistAlbum();
          render();
        };
        document.getElementById('pdf-orient-portrait').onclick = () => {
          state.orientation = 'portrait';
          syncPdfModalControls();
          persistAlbum();
          render();
        };
        document.getElementById('pdf-orient-landscape').onclick = () => {
          state.orientation = 'landscape';
          syncPdfModalControls();
          persistAlbum();
          render();
        };
        document.getElementById('pdf-opt-cover').onchange = (e) => {
          state.includeCover = e.target.checked;
          syncPdfModalControls();
        };
        document.getElementById('pdf-opt-closing').onchange = (e) => {
          state.includeClosing = e.target.checked;
          syncPdfModalControls();
        };
        document.getElementById('pdf-opt-numbers').onchange = (e) => {
          state.showPageNumbers = e.target.checked;
        };
        document.getElementById('pdf-download-btn').onclick = exportAlbumPdf;
        document.getElementById('pdf-export-png-btn').onclick = exportCurrentPagePng;

        // Global Drag & Drop
        let dragDepth = 0;
        const dropOverlay = document.getElementById('drop-overlay');
        document.addEventListener('dragenter', (e) => {
          if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
          e.preventDefault();
          dragDepth += 1;
          dropOverlay.classList.remove('hidden');
        });
        document.addEventListener('dragleave', (e) => {
          e.preventDefault();
          dragDepth = Math.max(0, dragDepth - 1);
          if (dragDepth === 0) dropOverlay.classList.add('hidden');
        });
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
          e.preventDefault();
          dragDepth = 0;
          dropOverlay.classList.add('hidden');
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            handleFilesSelected(e.dataTransfer.files);
          }
        });

        // Keyboard Left/Right Navigation
        document.addEventListener('keydown', (e) => {
          if (
            state.viewMode !== 'single' ||
            !settingsModal.classList.contains('hidden') ||
            !pdfModal.classList.contains('hidden')
          ) {
            return;
          }
          const target = e.target;
          if (
            target &&
            (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)
          ) {
            return;
          }
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setPageIndex(state.currentIndex - 1);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            setPageIndex(state.currentIndex + 1);
          }
        });

        // ---------- Initialize App ----------
        loadSavedAlbum().then((saved) => {
          if (saved && Array.isArray(saved.photos)) {
            state.photos = saved.photos;
            state.albumTitle = saved.albumTitle || '나의 사진 앨범';
            state.coverSubtitle = saved.coverSubtitle != null ? saved.coverSubtitle : '';
            state.authorName = saved.authorName != null ? saved.authorName : '';
            state.albumDate = saved.albumDate != null ? saved.albumDate : getTodayFormatted();
            state.closingMessage = saved.closingMessage != null ? saved.closingMessage : '';
            state.orientation = saved.orientation || 'portrait';
            state.pageStyle = saved.pageStyle || 'classic';
            state.theme = saved.theme || 'white';
            state.font = saved.font || 'myeongjo';
            state.isUsingSamples = Boolean(saved.isUsingSamples);
            state.currentIndex = 0;
          }
          state.isLoaded = true;
          render();
        });
      })();
    </script>
  </body>
</html>
